name: Full mutation audit

# The full-tree lane, off the pull-request matrix since 2026-09-04. It
# re-verifies code the diff never touched, so paying ~17 runner minutes for it
# on every push bought a re-run of yesterday's answer. Daily and cold here
# instead; the security and changed lanes still gate every pull request.
#
# It is not a merge gate, so it has to be loud on its own: a red run opens or
# updates a GitHub issue below, and the run itself stays red.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-audit-${{ github.event_name == 'schedule' && 'scheduled-cold' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  full-mutation:
    name: Full mutation audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .tool-versions

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Restore validated full-mutation cache
        if: github.event_name != 'schedule'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            reports/mutation/full/incremental.json
            reports/mutation/full/cache.json
          key: stryker-v2-full-${{ runner.os }}-${{ hashFiles('.tool-versions', 'bun.lock', 'stryker.config.mjs', 'vite.config.ts', 'quality/mutation-policy.json') }}-${{ github.sha }}
          restore-keys: stryker-v2-full-${{ runner.os }}-${{ hashFiles('.tool-versions', 'bun.lock', 'stryker.config.mjs', 'vite.config.ts', 'quality/mutation-policy.json') }}-

      - name: Run incremental full audit
        if: github.event_name != 'schedule'
        run: bun run test:mutation:full

      - name: Run forced-cold full audit
        if: github.event_name == 'schedule'
        run: bun run test:mutation:full -- --force-cold

      - name: Upload full mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-mutation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: reports/mutation/full/

      # No `continue-on-error`: the run stays red, and the issue exists so that a
      # red scheduled run is seen by someone who is not watching the Actions tab.
      # One issue per marker, commented on rather than reopened, so a lane that
      # stays red for a week does not file seven of them.
      - name: Raise an issue when the audit reports mutation debt
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- scheduled-full-mutation-audit -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nThe scheduled full-tree mutation audit failed on \`${context.sha}\`. The verdict and Stryker report are attached to ${run}.\n\nThis lane is not a merge gate: it re-verifies code no recent diff touched, so a failure here is untouched-code mutation debt, not a regression in the change that ran last. Read \`reports/mutation/full/verdict.json\` from the run artifacts, then either kill the surviving mutants or record a reviewed exception. Do not lower the threshold.`;
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'quality' });
            const previous = issues.find((issue) => issue.body?.includes(marker));

            if (previous) {
              await github.rest.issues.createComment({ owner, repo, issue_number: previous.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'Scheduled full mutation audit is failing', body, labels: ['quality'] });
            }
