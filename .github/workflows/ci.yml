name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every gate below runs to completion and writes reports/quality/gate-*.json.
  # An agent reads that file instead of scraping thirteen text formats.
  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .tool-versions

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Restore scanner image and rule cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Semgrep's hash-verified rule pack lives here, not in ~/.cache, and the
          # pinned scanner images are saved here too: a `docker pull` per run
          # costs more than restoring them. Scoped to exactly those two, because
          # they are all these jobs populate -- Trivy's database is a gigabyte
          # and belongs to the nightly scan, which deliberately does not cache
          # it either. See nightly.yml.
          path: |
            .security-cache/images
            .security-cache/semgrep
          key: security-cache-${{ runner.os }}-${{ hashFiles('scripts/security/config.ts') }}
          restore-keys: security-cache-${{ runner.os }}-

      - name: Warm pinned scanner images
        run: bun run security:images actionlint

      - name: Run static gate
        run: bun scripts/quality/gate.ts ci --job static

      - name: Upload static reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/

  unit:
    name: Unit and component coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .tool-versions

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('bun.lock') }}

      - name: Install browser runtimes
        run: bunx playwright install --with-deps chromium

      - name: Run coverage gate
        run: bun scripts/quality/gate.ts ci --job unit

      - name: Upload unit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            coverage/
            reports/

  # One lane, deliberately. The changed and full-tree lanes moved to the daily
  # schedule in mutation-audit.yml to cut runner minutes (product owner,
  # 2026-09-04). The security lane stays because the authentication boundary is
  # the one place where a test that fails to assert is a security risk rather
  # than a maintenance cost, and cold it is also the cheapest of the four at
  # 3m50.
  #
  # Kept as a matrix of one so the check keeps its name and `check:ci-contract`
  # keeps reading `job:` out of it; adding a lane back is one block, not a rewrite.
  mutation:
    name: Mutation (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: security
            job: mutation-security
            lane: security
            browser: false
            timeout: 20
    env:
      MUTATION_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .tool-versions

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Plan browser mutation scope
        if: matrix.browser
        id: mutation-scope
        run: |
          bun scripts/quality/mutation-run.ts ${{ matrix.lane }} --scope-only
          echo "needed=$(jq -r '.files | length > 0' reports/mutation/${{ matrix.lane }}/scope.json)" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium cache
        if: matrix.browser && steps.mutation-scope.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        if: matrix.browser && steps.mutation-scope.outputs.needed == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Restore validated mutation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            reports/mutation/${{ matrix.lane }}/incremental.json
            reports/mutation/${{ matrix.lane }}/cache.json
          key: stryker-v2-${{ matrix.lane }}-${{ runner.os }}-${{ hashFiles('.tool-versions', 'bun.lock', 'stryker.config.mjs', 'vite.config.ts', 'quality/mutation-policy.json') }}-${{ github.sha }}
          restore-keys: stryker-v2-${{ matrix.lane }}-${{ runner.os }}-${{ hashFiles('.tool-versions', 'bun.lock', 'stryker.config.mjs', 'vite.config.ts', 'quality/mutation-policy.json') }}-

      - name: Run required mutation lane
        run: bun scripts/quality/gate.ts ci --job ${{ matrix.job }}

      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            reports/mutation/${{ matrix.lane }}/
            reports/quality/

  build:
    name: Build and bundle budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .tool-versions

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run build gate
        run: bun scripts/quality/gate.ts ci --job build

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/

  # One job per browser project. Sharding was worth doing twice over: the suite
  # runs four projects, and each job now installs the one engine it needs
  # instead of all three. Inside a job the workers are parallel too -- see
  # `tests/preview-server.ts` for the isolation that made that safe.
  e2e:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
    env:
      E2E_PROJECT: ${{ matrix.project }}
      # Shards report a blob each; `e2e-report` merges them into the single
      # HTML and JSON report an agent reads.
      E2E_BLOB_REPORT: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .tool-versions

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('bun.lock') }}

      - name: Install browser runtimes
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Run end-to-end gate
        run: bun scripts/quality/gate.ts ci --job e2e

      - name: Upload e2e blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-blob-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            blob-report/

      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.project }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/
            test-results/

  # The shards' blobs, merged back into the one HTML report a human opens and
  # the one `reports/quality/playwright.json` an agent reads.
  e2e-report:
    name: End-to-end report
    if: always()
    needs: [e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .tool-versions

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Collect shard blobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-blob-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: all-blob-reports
          merge-multiple: true

      - name: Merge shard reports
        run: bunx playwright merge-reports --config playwright.config.ts all-blob-reports

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-merged-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            playwright-report/
            reports/quality/playwright.json

  security:
    name: Security (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .tool-versions

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Restore scanner image and rule cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Semgrep's hash-verified rule pack lives here, not in ~/.cache, and the
          # pinned scanner images are saved here too: a `docker pull` per run
          # costs more than restoring them. Scoped to exactly those two, because
          # they are all these jobs populate -- Trivy's database is a gigabyte
          # and belongs to the nightly scan, which deliberately does not cache
          # it either. See nightly.yml.
          path: |
            .security-cache/images
            .security-cache/semgrep
          key: security-cache-${{ runner.os }}-${{ hashFiles('scripts/security/config.ts') }}
          restore-keys: security-cache-${{ runner.os }}-

      - name: Warm pinned scanner images
        run: bun run security:images gitleaks semgrep

      # Gitleaks and Semgrep are code-derived and deterministic, so they block a
      # merge. Trivy and ZAP depend on feeds that change without a code change;
      # gating on them would contradict the determinism this repo promises. They
      # run in nightly.yml instead.
      - name: Run blocking security gate
        run: bun scripts/quality/gate.ts ci --job security

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/

  # Three runners, split by what a fixture costs and what it needs installed:
  # the nested Stryker runs, the nested browser runs, and everything else.
  # `scripts/quality/self-test-groups.ts` owns that split and
  # `check:ci-contract` proves this matrix still covers all of it, so a fixture
  # added later cannot fall out of CI.
  self-test:
    name: Gate self-test (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: browser
            docker: false
            browser: true
          - group: mutation
            docker: false
            browser: false
          - group: static
            docker: true
            browser: false
    env:
      SELF_TEST_GROUP: ${{ matrix.group }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .tool-versions

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Restore scanner image and rule cache
        if: matrix.docker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Scoped to what this job populates: the pinned scanner images and
          # Semgrep's rule pack. Trivy's database is not here -- see nightly.yml.
          path: |
            .security-cache/images
            .security-cache/semgrep
          key: security-cache-${{ runner.os }}-${{ hashFiles('scripts/security/config.ts') }}
          restore-keys: security-cache-${{ runner.os }}-

      - name: Warm pinned scanner images
        if: matrix.docker
        run: bun run security:images actionlint gitleaks semgrep

      - name: Restore Playwright browser cache
        if: matrix.browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('bun.lock') }}

      # The browser fixtures run the default project, which is mobile-chrome on
      # the Chromium engine. Firefox and WebKit are only needed by the e2e job.
      - name: Install browser runtimes
        if: matrix.browser
        run: bunx playwright install --with-deps chromium

      # Proves each gate rejects input it claims to reject. Without this, every
      # threshold in the repository is an assertion nobody has tested.
      - name: Run gate self-test
        run: bun scripts/quality/gate.ts ci --job self-test

      - name: Upload self-test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-test-reports-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/

  all-green:
    name: Quality and security
    if: always()
    needs: [static, unit, mutation, build, e2e, e2e-report, security, self-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every gate to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Gate results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required gate did not succeed."
              exit 1
            fi
          done
