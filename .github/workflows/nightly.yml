name: Nightly security

# Trivy's vulnerability database and ZAP's findings change without a code change.
# Gating a merge on them would contradict the determinism this repository
# promises, so they run on a schedule and raise an issue instead of blocking.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  advisory-security:
    name: Advisory scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .tool-versions

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Restore Bun package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      # Only the images and the rule pack. Trivy's vulnerability database is
      # deliberately left out: it is ~1.3 GB, its metadata sets NextUpdate 24
      # hours after each rebuild, and this job runs every 24 hours -- so a
      # restored copy is stale about half the time and Trivy downloads it again
      # anyway. Against the repository's 10 GB cache budget an entry that size
      # evicts the Bun and Playwright caches that every pull-request job
      # restores, to save a download that mostly does not happen.
      - name: Restore scanner image and rule cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .security-cache/images
            .security-cache/semgrep
          key: security-cache-${{ runner.os }}-${{ hashFiles('scripts/security/config.ts') }}
          restore-keys: security-cache-${{ runner.os }}-

      - name: Install browser runtimes
        run: bunx playwright install --with-deps chromium

      - name: Run advisory security gate
        id: scan
        continue-on-error: true
        run: bun run nightly

      - name: Upload advisory security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-reports-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/

      - name: Raise an issue when a scanner reports findings
        if: steps.scan.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- nightly-advisory-security -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nThe scheduled Trivy and ZAP scan reported findings. Reports are attached to ${run}.\n\nThese scanners depend on external feeds, so this can change without a code change. Triage the findings and either fix them or record a justified suppression.`;
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'security' });
            const previous = issues.find((issue) => issue.body?.includes(marker));

            if (previous) {
              await github.rest.issues.createComment({ owner, repo, issue_number: previous.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'Nightly advisory security findings', body, labels: ['security'] });
            }
